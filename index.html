<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كائن كيوت مجنح يتبع إصبعك</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ff00e1;
            touch-action: none; /* منع التمرير على الهواتف */
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .instruction {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #f8f6f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="instruction">المس الشاشة وسيجري الكائن خلف إصبعك! ✨</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // خلفية نجوم متلألئة
        const stars = [];
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2,
                alpha: Math.random()
            });
        }

        // حالة التتبع واللمس
        let isTouching = false;
        const target = { x: width / 2, y: height / 2 };

        function startTouch(e) {
            isTouching = true;
            updateTarget(e);
        }

        function endTouch() {
            isTouching = false;
        }

        function updateTarget(e) {
            if (!isTouching) return;
            if (e.touches && e.touches.length > 0) {
                target.x = e.touches[0].clientX;
                target.y = e.touches[0].clientY;
            } else {
                target.x = e.clientX;
                target.y = e.clientY;
            }
        }

        window.addEventListener('mousedown', startTouch);
        window.addEventListener('mouseup', endTouch);
        window.addEventListener('mousemove', updateTarget);

        window.addEventListener('touchstart', startTouch, { passive: true });
        window.addEventListener('touchend', endTouch, { passive: true });
        window.addEventListener('touchmove', updateTarget, { passive: true });

        // كائن ثعباني كيوت مجنح
        class CuteDragon {
            constructor() {
                this.numSegments = 22;
                this.segmentLength = 16;
                this.segments = [];

                for (let i = 0; i < this.numSegments; i++) {
                    this.segments.push({
                        x: width / 2 - i * this.segmentLength,
                        y: height / 2,
                        angle: 0
                    });
                }

                this.wingFlap = 0;
            }

            update() {
                this.wingFlap += 0.12;

                // التوقف التام عند رفع الإصبع
                if (!isTouching) return;

                const head = this.segments[0];
                const dx = target.x - head.x;
                const dy = target.y - head.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 5) {
                    const angle = Math.atan2(dy, dx);
                    head.angle = angle;
                    head.x += Math.cos(angle) * Math.min(dist * 0.1, 8);
                    head.y += Math.sin(angle) * Math.min(dist * 0.1, 8);
                }
                for (let i = 1; i < this.numSegments; i++) {
                    const prev = this.segments[i - 1];
                    const curr = this.segments[i];

                    const dx = prev.x - curr.x;
                    const dy = prev.y - curr.y;
                    curr.angle = Math.atan2(dy, dx);

                    curr.x = prev.x - Math.cos(curr.angle) * this.segmentLength;
                    curr.y = prev.y - Math.sin(curr.angle) * this.segmentLength;
                }
            }

            draw() {
                // 1. رسم الأجنحة عند الفقرة الثانية
                this.drawCuteWings(this.segments[2]);

                // 2. رسم دوائر الجسم الناعمة والأضلاع اللطيفة
                for (let i = this.numSegments - 1; i >= 1; i--) {
                    this.drawCuteBodySegment(this.segments[i], i);
                }

                // 3. رسم الرأس والوجه الكيوت
                this.drawCuteHead(this.segments[0]);
            }

            drawCuteWings(segment) {
                ctx.save();
                ctx.translate(segment.x, segment.y);
                ctx.rotate(segment.angle);

                const flap = Math.sin(this.wingFlap) * 0.35;

                for (let side of [-1, 1]) {
                    ctx.save();
                    ctx.scale(1, side);
                    ctx.rotate(flap);

                    // جناح ملاك/تنين لطيف باللون الوردي/البنفسجي الناعم
                    ctx.fillStyle = '#ffb6c1';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#ffb6c1';

                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(-15, 35, -5, 60);
                    ctx.quadraticCurveTo(15, 50, 20, 35);
                    ctx.quadraticCurveTo(20, 20, 0, 0);
                    ctx.fill();
                    ctx.stroke();

                    ctx.restore();
                }

                ctx.restore();
            }

            drawCuteBodySegment(seg, index) {
                ctx.save();
                ctx.translate(seg.x, seg.y);

                const radius = Math.max(3, (this.numSegments - index) * 0.85);

                // دوائر ناصعة البياض وناعمة
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#87cefa';

                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            drawCuteHead(head) {
                ctx.save();
                ctx.translate(head.x, head.y);
                ctx.rotate(head.angle);

                // رأس دائري كيوت ناعم
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffffff';

                ctx.beginPath();
                ctx.arc(4, 0, 18, 0, Math.PI * 2);
                ctx.fill();

                // خدود وردية كيوت (Blush)
                ctx.fillStyle = 'rgba(255, 105, 180, 0.5)';
                ctx.beginPath();
                ctx.arc(8, -10, 4, 0, Math.PI * 2);
                ctx.arc(8, 10, 4, 0, Math.PI * 2);
                ctx.fill();

                // العيون الواسعة الجذابة
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.arc(10, -6, 4.5, 0, Math.PI * 2);
                ctx.arc(10, 6, 4.5, 0, Math.PI * 2);
                ctx.fill();

                // بريق/لمعة العين البيضاء (Anime Eye Sparkle)
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(12, -7, 1.8, 0, Math.PI * 2);
                ctx.arc(12, 5, 1.8, 0, Math.PI * 2);
                ctx.arc(9, -5, 0.8, 0, Math.PI * 2);
                ctx.arc(9, 7, 0.8, 0, Math.PI * 2);
                ctx.fill();
                // ابتسامة لطيفة
                ctx.strokeStyle = '#1a1a2e';
                ctx.lineWidth = 1.8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(14, 0, 3, 0.1, Math.PI - 0.1);
                ctx.stroke();

                ctx.restore();
            }
        }

        const dragon = new CuteDragon();

        function animate() {
            ctx.fillStyle = '#ff00e1';
            ctx.fillRect(0, 0, width, height);

            // رسم النجوم المتلألئة
            stars.forEach(star => {
                ctx.fillStyle = 'rgba(255, 255, 255, ${star.alpha})';
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            dragon.update();
            dragon.draw();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
